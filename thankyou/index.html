<style>
  /* This page opens inside the xtix widget (iframe), so it is just the pink block,

  html, body.ty { background: var(--black); padding: 0; min-height: 100%; }
  body.ty { min-height: 100vh; display: flex; }
  .ty-hero {
    flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 24px;

    padding: clamp(24px, 3.5vw, 50px) 16px;
  }
  /* size follows the frame width (mobile proportions), never bigger than desktop size */
  .ty-hero .t { font-size: min(calc(var(--m) * 100vw / 390), calc(var(--d) * 1px)); }
  .ty-hero { gap: 12px; }
  /* wider frames: desktop layout from Figma, scaled down to the frame width */
  /* black block texture, same as the black blocks on the main page */

  .ty-hero::after { z-index: 2; mix-blend-mode: color-dodge; opacity: 1; }
  @media (min-width: 560px) {
    .ty-hero { gap: clamp(12px, 1.7vw, 24px); }
    .ty-hero .t { font-size: min(calc(var(--d) * 100vw / 1440), calc(var(--d) * 1px)); }

  }
